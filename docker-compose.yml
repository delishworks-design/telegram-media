services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      DATABASE_PATH: /data/media.sqlite
      UPLOAD_TMP_DIR: /data/uploads
    volumes:
      - media-data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      EMAIL: ${EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  media-data:
  caddy-data:
  caddy-config:
